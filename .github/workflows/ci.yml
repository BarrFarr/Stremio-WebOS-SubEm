name: Build and validate
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install webOS CLI
        run: |
          set -euo pipefail
          npm install --global @webos-tools/cli
          command -v ares-package
          ares -V
      - name: Validate JSON and source metadata
        run: |
          set -euo pipefail
          jq -e . webosbrew/apps.json >/dev/null
          jq -e . app/appinfo.json >/dev/null
          jq -e . service/package.json >/dev/null
          node scripts/verify-build.js
      - name: Build package
        run: |
          set -euo pipefail
          make package
      - name: Verify built frontend and IPK
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(jq -r .id app/appinfo.json)"
          VERSION="$(jq -r .version app/appinfo.json)"
          IPK="${APP_ID}_${VERSION}_all.ipk"
          test -s "$IPK"
          node scripts/verify-build.js --frontend-only
          ares-package -i "$IPK"
          ares-package -I "$IPK"
